<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width,initial-scale=1">
 <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; object-src 'none'; base-uri 'none'">
 <title>服务器设置</title>
 <link rel="stylesheet" href="settings.css">
</head>
<body>
 <main>
  <h1>服务器设置</h1>
  <p>填写管理员提供的服务器地址，所有玩家连接同一台服务器。</p>
  <form id="settingsForm">
   <label for="serverUrl">服务器地址</label>
   <input id="serverUrl" type="url" required placeholder="https://game.example.com" autocomplete="off">
   <p id="settingsError" role="alert"></p>
   <footer><button id="cancelSettings" type="button">取消</button><button id="saveSettings" type="submit">保存并连接</button></footer>
  </form>
 </main>
 <script src="settings.js"></script>
</body>
</html>
